<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  :root{
    --page:#F0EEE6; --surface:#FCFCFB; --ink:#191919; --ink2:#52514E; --muted:#898781;
    --accent:#CC785C; --border:rgba(11,11,11,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:var(--page);
       font-family:"Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:24px;
        width:1120px;height:550px;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
  .kicker{font-size:24px;font-weight:600;color:var(--accent);letter-spacing:.14em}
  h1{font-family:"Noto Serif CJK JP","Noto Serif JP",Georgia,serif;font-size:64px;font-weight:600;
     color:var(--ink);line-height:1.35;letter-spacing:.01em;margin-top:20px}
  .sub{font-size:26px;color:var(--ink2);margin-top:24px;line-height:1.6}
  .foot{display:flex;align-items:center;justify-content:space-between}
  .site{font-size:24px;color:var(--muted)}
  .mark{width:56px;height:56px;border-radius:14px;background:var(--accent);color:#fff;
        font-family:Georgia,serif;font-size:28px;font-weight:600;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="card">
  <div>
    <div class="kicker">連載</div>
    <h1>全損から始める自動売買</h1>
    <div class="sub">AIと作る、負けない仕組みの記録 — FX検証・運用記録ブログ</div>
  </div>
  <div class="foot">
    <div class="site">fx-blog.secure-auto-lab.com</div>
    <div class="mark">fx</div>
  </div>
</div>
</body></html>
