<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  :root{
    --page:#F0EEE6; --surface:#FCFCFB; --ink:#191919; --ink2:#52514E; --muted:#898781;
    --grid:#E1E0D9; --axis:#C3C2B7; --accent:#CC785C; --blue:#2A78D6; --crit:#D03B3B;
    --border:rgba(11,11,11,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--page);font-family:"Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;padding:28px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 36px;width:1540px}
  h1{font-family:"Noto Serif CJK JP","Noto Serif JP",Georgia,serif;font-size:26px;color:var(--ink);font-weight:600;letter-spacing:.01em}
  .sub{font-size:14px;color:var(--ink2);margin-top:6px}
  .foot{font-size:12px;color:var(--muted);margin-top:10px}
  text{font-family:"Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif}
</style></head><body>
<div class="card">
  <h1>図1｜入金と破綻のタイムライン（2021–2026）</h1>
  <div class="sub">同じ金額の入金が繰り返される——履歴そのものが「溶かしては入れる」の記録になっている</div>
  <svg width="1468" height="470" viewBox="0 0 1468 470">
    <!-- x: 2021.0->80 , 2026.75->1420 ; px per year = 233.04 -->
    <!-- year gridlines -->
    <g stroke="#E1E0D9" stroke-width="1">
      <line x1="80" y1="60" x2="80" y2="330"/><line x1="313" y1="60" x2="313" y2="330"/>
      <line x1="546" y1="60" x2="546" y2="330"/><line x1="779" y1="60" x2="779" y2="330"/>
      <line x1="1012" y1="60" x2="1012" y2="330"/><line x1="1245" y1="60" x2="1245" y2="330"/>
    </g>
    <!-- axis -->
    <line x1="60" y1="330" x2="1430" y2="330" stroke="#C3C2B7" stroke-width="1.5"/>
    <g fill="#898781" font-size="14">
      <text x="80" y="354" text-anchor="middle">2021</text>
      <text x="313" y="354" text-anchor="middle">2022</text>
      <text x="546" y="354" text-anchor="middle">2023</text>
      <text x="779" y="354" text-anchor="middle">2024</text>
      <text x="1012" y="354" text-anchor="middle">2025</text>
      <text x="1245" y="354" text-anchor="middle">2026</text>
    </g>

    <!-- deposits: lollipops (coral). height ∝ amount. 20万=170px, 6万=60px, 5万=52px -->
    <!-- 2021-01-21 x=80+0.055*233=93 ; 03-05 x=80+0.175*233=121 ; 08-20 x=80+0.63*233=227 ; 09-06 x=80+0.68*233=238 -->
    <!-- 2022-05-03 x=313+0.34*233=392 ; 2022-07-25 x=313+0.56*233=443 -->
    <g stroke="#CC785C" stroke-width="2.5">
      <line x1="93"  y1="330" x2="93"  y2="160"/>
      <line x1="121" y1="330" x2="121" y2="160"/>
      <line x1="227" y1="330" x2="227" y2="160"/>
      <line x1="238" y1="330" x2="238" y2="160"/>
      <line x1="392" y1="330" x2="392" y2="270"/>
      <line x1="443" y1="330" x2="443" y2="262"/>
    </g>
    <g fill="#CC785C" stroke="#FCFCFB" stroke-width="2">
      <circle cx="93"  cy="160" r="7"/><circle cx="121" cy="160" r="7"/>
      <circle cx="227" cy="160" r="7"/><circle cx="238" cy="160" r="7"/>
      <circle cx="392" cy="270" r="7"/><circle cx="443" cy="262" r="7"/>
    </g>
    <g fill="#191919" font-size="14" font-weight="600">
      <text x="93"  y="140" text-anchor="middle">20万</text>
      <text x="121" y="112" text-anchor="middle">20万</text>
      <text x="233" y="140" text-anchor="middle">20万 ×2</text>
      <text x="392" y="250" text-anchor="middle">5万</text>
      <text x="447" y="242" text-anchor="middle">6万</text>
    </g>
    <text x="100" y="86" fill="#52514E" font-size="13">入金（記録が残っているもの）</text>

    <!-- 2025 final account: rise to 400万 then cliff -->
    <!-- band x: 2025.0=1012 .. 2025.9=1222 . rise from (1032,320) to (1150,95), cliff to (1162,325) -->
    <path d="M 1032 322 C 1080 300, 1110 200, 1150 95" fill="none" stroke="#CC785C" stroke-width="3" stroke-linecap="round"/>
    <path d="M 1150 95 L 1162 322" fill="none" stroke="#D03B3B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1150" cy="95" r="7" fill="#CC785C" stroke="#FCFCFB" stroke-width="2"/>
    <g transform="translate(1162,322)"><path d="M -6 -6 L 6 6 M 6 -6 L -6 6" stroke="#D03B3B" stroke-width="3" stroke-linecap="round"/></g>
    <text x="1150" y="72" text-anchor="middle" fill="#191919" font-size="15" font-weight="700">400万円</text>
    <text x="1035" y="285" fill="#52514E" font-size="13">20万円から</text>
    <text x="1178" y="300" fill="#D03B3B" font-size="14" font-weight="600">残高 0</text>
    <text x="1178" y="320" fill="#898781" font-size="13">——「またか」</text>

    <!-- AI start marker 2026夏 x=1245+0.58*233=1380 -->
    <g transform="translate(1380,330)">
      <line x1="0" y1="0" x2="0" y2="-92" stroke="#2A78D6" stroke-width="2.5"/>
      <rect x="-8" y="-108" width="16" height="16" rx="3" fill="#2A78D6"/>
    </g>
    <text x="1362" y="188" text-anchor="end" fill="#191919" font-size="14" font-weight="600">AIとの検証開始</text>
    <text x="1362" y="206" text-anchor="end" fill="#52514E" font-size="13">2026年夏</text>

    <!-- phase bands -->
    <g font-size="14">
      <rect x="80"  y="392" width="466" height="44" rx="8" fill="#CC785C" opacity="0.14"/>
      <text x="313" y="419" text-anchor="middle" fill="#191919">溶かしては入金を繰り返す（5回以上ゼロに）</text>
      <rect x="556" y="392" width="446" height="44" rx="8" fill="#898781" opacity="0.13"/>
      <text x="779" y="419" text-anchor="middle" fill="#52514E">FXと距離を置く</text>
      <rect x="1012" y="392" width="220" height="44" rx="8" fill="#D03B3B" opacity="0.12"/>
      <text x="1122" y="419" text-anchor="middle" fill="#191919">最後の口座</text>
      <rect x="1242" y="392" width="178" height="44" rx="8" fill="#2A78D6" opacity="0.13"/>
      <text x="1331" y="419" text-anchor="middle" fill="#191919">検証・再構築</text>
    </g>
  </svg>
  <div class="foot">出所: 筆者の入金履歴（クレジットカード入金分のスクリーンショット）。入金総額は記録外を含め数百万円。金額・時期は概数。</div>
</div>
</body></html>
